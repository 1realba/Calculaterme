[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Route all /api/* requests to Netlify serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Route all other routes to index.html for SPA client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
